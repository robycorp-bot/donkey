[package]
name = "coder-mega-brain"
version = "0.2.0"
description = "Editor pessoal nativo com Boteco de IA"
authors = ["Robycorp"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "coder_mega_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"
zeroize = "1"
tiny_http = "0.12"
mime_guess = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
